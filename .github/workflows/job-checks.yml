name: Run checks

on:
  workflow_call:
    inputs:
      push_coverage:
        type: boolean
        description: "If true, the coverage results are pushed to codecov.io."
        default: true
      python_versions:
        type: string
        description: 'JSON array of Python versions to use for multi-version jobs, e.g. ["3.10", "3.12"].'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ubuntu-ci
        with:
          python_version: "3.10"
          uv_sync_args: --frozen --all-extras

      - name: Set prek cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache prek environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/prek
          key: prek|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek|${{ env.PY }}|

      - name: Check style
        run: |
          echo "--- Running prek style checks ---"
          uv run --no-sync prek run --all-files

  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ubuntu-ci
        with:
          python_version: ${{ matrix.python-version }}
          uv_sync_args: --frozen --all-extras

      - name: Run tests
        run: uv run --no-sync pytest --cov=docling_mcp --cov-report=xml tests

      - name: Upload coverage to Codecov
        if: inputs.push_coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

  build-package:
    uses: ./.github/workflows/job-build.yml

  test-package:
    needs:
      - build-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: false

      - name: Install package
        run: uv pip install dist/*.whl

      - name: Create the server
        run: python -c 'import docling_mcp.servers.mcp_server'

  check:
    if: ${{ always() }}
    needs:
      - lint
      - run-checks
      - build-package
      - test-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: All Green
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/check_needs_results.py
          --needs-json "$NEEDS_JSON"
